<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Riwayat — DRCC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>try{if(localStorage.getItem('drcc_dark_mode')==='true')document.documentElement.classList.add('dark-mode')}catch(e){}</script>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/tables.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><i class="fas fa-shield-halved"></i></div><div class="sidebar-title"><h3>DRCC</h3><p>Command Center</p></div></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn" onclick="Sidebar.toggle()" type="button"><i class="fas fa-angles-left" id="sidebar-toggle-icon"></i><span>Sembunyikan Panel</span></button>
      <button class="sidebar-footer-btn danger" onclick="Auth.logout()" type="button"><i class="fas fa-right-from-bracket"></i><span>Keluar</span></button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="main-area">
    <header class="navbar">
      <div class="navbar-left">
        <button class="navbar-mobile-toggle" onclick="Sidebar.toggle()" type="button"><i class="fas fa-bars"></i></button>
        <div class="navbar-page-title"><h4 id="page-title">Riwayat</h4><span id="page-subtitle">Log aktivitas</span></div>
      </div>
      <div class="navbar-center"><div class="sys-status"><div class="sys-dot"></div><span>SISTEM AKTIF</span></div></div>
      <div class="navbar-right">
        <div class="navbar-clock" id="navbar-clock">--:--:--</div>
        <div class="navbar-divider"></div>
        <button class="navbar-btn" type="button"><i class="fas fa-bell"></i><span class="navbar-badge" id="notif-badge">3</span></button>
        <div class="navbar-divider"></div>
        <div class="navbar-user"><div class="user-avatar" id="user-avatar">AD</div><div class="user-info"><span class="user-name" id="user-name">Admin</span><span class="user-role-badge role-admin" id="user-role-badge">Admin BNPB</span></div></div>
      </div>
    </header>

    <main class="page-content" id="page-content">

      <!-- Header -->
      <div class="page-header">
        <div class="page-header-left"><h2>Riwayat Aktivitas</h2><p>Log lengkap semua insiden, analisis AI, marker peta, dan sumber daya</p></div>
        <div class="page-header-right">
          <button class="btn btn-secondary btn-sm" onclick="resetHistFilters()" type="button"><i class="fas fa-filter-circle-xmark"></i> Reset Filter</button>
          <button class="btn btn-primary btn-sm"   onclick="exportHistoryCSV()"  type="button"><i class="fas fa-file-csv"></i> Export CSV</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="crud-stats">
        <div class="crud-stat-card total"><div class="crud-stat-num" id="hs-total">0</div><div class="crud-stat-label">Total Entri</div></div>
        <div class="crud-stat-card aktif"><div class="crud-stat-num" id="hs-insiden">0</div><div class="crud-stat-label">Insiden</div></div>
        <div class="crud-stat-card info"><div class="crud-stat-num" id="hs-ai">0</div><div class="crud-stat-label">AI Analisis</div></div>
        <div class="crud-stat-card done"><div class="crud-stat-num" id="hs-peta">0</div><div class="crud-stat-label">Peta Marker</div></div>
        <div class="crud-stat-card medium"><div class="crud-stat-num" id="hs-bahaya">0</div><div class="crud-stat-label">Level Bahaya</div></div>
      </div>

      <!-- Filter Bar -->
      <div class="hist-filter-bar">
        <!-- Date range -->
        <div class="hist-filter-group">
          <label>Dari</label>
          <input class="hist-date-input" id="hf-from" type="date" onchange="histDateFrom(this.value)">
        </div>
        <div class="hist-filter-group">
          <label>Sampai</label>
          <input class="hist-date-input" id="hf-to" type="date" onchange="histDateTo(this.value)">
        </div>
        <div class="hist-filter-sep"></div>
        <!-- Type -->
        <div class="hist-filter-group">
          <label>Tipe</label>
          <select class="form-select" id="hf-type" style="padding:5px 28px 5px 10px;font-size:12px;height:auto" onchange="histTypeChange(this.value)">
            <option value="all">Semua Tipe</option>
            <option value="insiden">Insiden</option>
            <option value="ai">AI Analisis</option>
            <option value="peta">Peta Marker</option>
            <option value="sumberdaya">Sumber Daya</option>
            <option value="sinyal">Sinyal</option>
          </select>
        </div>
        <!-- Level -->
        <div class="hist-filter-group">
          <label>Level</label>
          <select class="form-select" id="hf-level" style="padding:5px 28px 5px 10px;font-size:12px;height:auto" onchange="histLevelChange(this.value)">
            <option value="all">Semua Level</option>
            <option value="BAHAYA">Bahaya</option>
            <option value="SIAGA">Siaga</option>
            <option value="WASPADA">Waspada</option>
            <option value="NORMAL">Normal</option>
            <option value="INFO">Info</option>
          </select>
        </div>
        <div class="hist-filter-sep"></div>
        <!-- Search -->
        <div class="search-bar" style="width:220px;flex:1">
          <i class="fas fa-magnifying-glass"></i>
          <input id="hf-search" type="text" placeholder="Cari kata kunci..." oninput="histSearchChange(this.value)">
        </div>
        <span style="font-size:12px;color:var(--text-muted);white-space:nowrap"><span id="hist-count">0</span> entri</span>
      </div>

      <!-- Table -->
      <div class="crud-table-wrap">
        <table>
          <thead><tr>
            <th>Waktu</th><th>Tipe</th><th>Judul &amp; Detail</th>
            <th>Level</th><th class="hide-mobile">Sumber</th><th>Ref ID</th>
          </tr></thead>
          <tbody id="hist-tbody"></tbody>
        </table>
        <div id="hist-pagination" style="padding:4px 16px"></div>
      </div>

    </main>
  </div>
</div>
<div id="toast-container"></div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/core/api-client.js"></script>
<script src="../assets/js/core/socket-client.js"></script>
<script src="../assets/js/core/app.js"></script>
<script src="../assets/js/core/state.js"></script>

<script src="../assets/js/pages/history.js"></script>
<script>document.addEventListener('DOMContentLoaded', initHistory);</script>
</body>
</html>
